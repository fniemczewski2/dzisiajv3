# Cloudflare Email Worker – bramka przekierowań poczty.
# Sekret: npx wrangler secret put MAIL_INBOUND_SECRET
name = "dzisiaj-mail-gateway"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
INBOUND_URL = "https://www.dzisiaj.fun/api/mail/inbound"
# Limit jednego PDF z biletem (bajty). Zmiana: docs/RUNBOOK.md, „Limity wiadomości (bilety)”.
MAX_PDF_BYTES = "2000000"
REPLY_FROM = "bilety@dzisiaj.fun"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
