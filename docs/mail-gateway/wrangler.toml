# Cloudflare Email Worker – bramka przekierowań poczty.
# Sekret: npx wrangler secret put MAIL_INBOUND_SECRET
name = "dzisiaj-mail-gateway"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
INBOUND_URL = "https://www.dzisiaj.fun/api/mail/inbound"
# Limit jednego PDF z biletem (bajty). Zmiana: docs/RUNBOOK.md, „Limity wiadomości (bilety)”.
MAX_PDF_BYTES = "2000000"
