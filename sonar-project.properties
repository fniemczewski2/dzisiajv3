# sonar-project.properties – konfiguracja analizy SonarQube / SonarCloud (job „Analiza SonarQube” w CI).
# Uzupełnij klucz projektu i organizację po utworzeniu projektu w SonarCloud
# (albo ustaw je w zmiennych repozytorium i usuń z tego pliku).

sonar.projectKey=fniemczewski2_dzisiajv3
sonar.organization=fniemczewski2
sonar.projectName=Dzisiaj.Fun

sonar.sourceEncoding=UTF-8
sonar.sources=components,config,hooks,lib,pages,providers,types,supabase/functions,proxy.ts
sonar.tests=__tests__,supabase/functions
sonar.test.inclusions=__tests__/**,supabase/functions/**/*_test.ts
sonar.exclusions=**/*_test.ts,public/**,**/*.d.ts

# Pokrycie z Vitest (npm run test:coverage -- --coverage.reporter=lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Edge Functions testuje Deno (bez raportu lcov), types/ to same deklaracje.
sonar.coverage.exclusions=supabase/functions/**,types/**
