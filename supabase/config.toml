project_id = "awgzftvoqyafqlsntmcc"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.dzisiaj.fun"
additional_redirect_urls = ["https://www.dzisiaj.fun/**"]
# Token dostępu ważny godzinę; refresh tokeny rotowane, ponowne użycie starego unieważnia rodzinę tokenów
# (po krótkim oknie na równoległe odświeżenia z kilku kart).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# Linki i kody jednorazowe (magic link, potwierdzenia) wygasają po godzinie.
otp_expiry = 3600

[storage]
enabled = true

[functions]
[functions.send-push]
verify_jwt = false

[functions.process-notifications]
verify_jwt = false

[functions.process-reminders]
verify_jwt = false


[functions.log-error]
verify_jwt = true

[functions.send-love]
verify_jwt = true

[functions.transport-departures]
verify_jwt = true